# ---------------------------------------------------------------------------
# MyWebApp - local Docker Compose setup
# ---------------------------------------------------------------------------
# Usage:
#   docker compose up --pull always
#       or
#   docker compose up --pull always --build -d
#
# Secrets and connection details are read from .env.docker.local, which is
# git-ignored. See .env.docker.local.example for the required variables.
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Local-only image: build it locally instead of pulling from a registry.
    # Use `docker compose up --build` after changing the Dockerfile or source.
    image: mywebapp:debug
    pull_policy: never
    ports:
      - "8080:8080"
    env_file:
      - .env.docker.local
    # Reuse Docker's default bridge, which can reach the host PostgreSQL
    # endpoint in this environment.
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s