# ---------------------------------------------------------------------------
# MyWebApp - local Docker Compose setup
# ---------------------------------------------------------------------------
# Usage:
#   docker compose up --pull always
#
# Secrets and connection details are read from .env.docker.local, which is
# git-ignored. See .env.docker.local.example for the required variables.
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mywebapp:debug
    ports:
      - "8080:8080"
    env_file:
      - .env.docker.local
    extra_hosts:
      # Makes host.docker.internal resolve on Linux, where Docker does not
      # provide this name by default.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s