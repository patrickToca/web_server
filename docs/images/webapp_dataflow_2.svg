<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1400 1480"
     width="1400" height="1480"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="12">

  <defs>
    <style>
      .group-title   { font-size: 14px; font-weight: 700; fill: #1f2937; text-anchor: middle; }

      .phase-bg      { stroke-width: 1.2; rx: 4; }
      .phase-label   { font-size: 12px; font-weight: 700; fill: #111827; text-anchor: middle; }

      .actor-box     { rx: 6; stroke-width: 1; }
      .actor-title   { font-size: 13px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .actor-sub     { font-size: 10px; fill: #4b5563; text-anchor: middle; }

      .lifeline      { stroke: #6b7280; stroke-width: 1; stroke-dasharray: 4 5; opacity: 0.75; }

      .activation    { fill: #ffffff; stroke: #374151; stroke-width: 1; }

      .msg           { fill: none; stroke: #1f2937; stroke-width: 1.3;
                       marker-end: url(#arrow-dark); }
      .msg-return    { fill: none; stroke: #4b5563; stroke-width: 1.1;
                       stroke-dasharray: 4 3; marker-end: url(#arrow-mid); }
      .msg-r2        { fill: none; stroke: #7c3aed; stroke-width: 1.3;
                       marker-end: url(#arrow-violet); }
      .msg-r2-return { fill: none; stroke: #7c3aed; stroke-width: 1.1;
                       stroke-dasharray: 4 3; marker-end: url(#arrow-violet); }
      .msg-db        { fill: none; stroke: #b91c1c; stroke-width: 1.3;
                       marker-end: url(#arrow-red); }
      .msg-db-return { fill: none; stroke: #b91c1c; stroke-width: 1.1;
                       stroke-dasharray: 4 3; marker-end: url(#arrow-red); }

      .msg-label     { font-size: 11px; fill: #111827; }
      .msg-note      { font-size: 10px; fill: #4b5563; }
      .cookie-label  { font-size: 10px; fill: #1e40af;
                       font-family: 'SFMono-Regular', Consolas, monospace; }
      .cookie-label2 { font-size: 10px; fill: #7c3aed;
                       font-family: 'SFMono-Regular', Consolas, monospace; }

      .fragment      { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; rx: 4; }
      .fragment-tab  { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1; }
      .fragment-lbl  { font-size: 11px; font-weight: 600; fill: #374151; }
      .fragment-cond { font-size: 10px; font-weight: 600; fill: #374151; }
      .fragment-line { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 4 3; }

      .self-call     { fill: none; stroke: #6b7280; stroke-width: 1; }
    </style>

    <marker id="arrow-dark"   viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-mid"    viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red"    viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="1480" fill="#ffffff"/>

  <!-- ================================================================
       Go Web Application grouping (left)
       ================================================================ -->
  <rect x="330" y="20" width="680" height="1440" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" rx="4"/>
  <text x="670" y="46" class="group-title">Go Web Application (Gin)</text>

  <!-- ================================================================
       Actor headers (top row)
       ================================================================ -->

  <!-- Client / Browser (stick figure) -->
  <circle cx="70" cy="90" r="14" fill="none" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="70" y1="104" x2="70" y2="128" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="52" y1="112" x2="88" y2="112" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="70" y1="128" x2="56" y2="148" stroke="#4b5563" stroke-width="1.4"/>
  <line x1="70" y1="128" x2="84" y2="148" stroke="#4b5563" stroke-width="1.4"/>
  <text x="70" y="172" class="actor-title">Client / Browser</text>

  <!-- Middleware column header -->
  <rect x="360" y="60" width="160" height="60" class="actor-box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="440" y="86" class="actor-title">Security / CSRF / Auth</text>
  <text x="440" y="104" class="actor-title">Middleware</text>

  <!-- Handlers & Services column header -->
  <rect x="600" y="60" width="160" height="60" class="actor-box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="680" y="86" class="actor-title">Handlers &amp; Services</text>
  <text x="680" y="104" class="actor-title">(Web / API)</text>

  <!-- R2 Client column header -->
  <rect x="840" y="60" width="160" height="60" class="actor-box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="920" y="86" class="actor-title">R2 Client</text>
  <text x="920" y="104" class="actor-title">(AWS SDK v2)</text>

  <!-- PostgreSQL (cylinder) -->
  <ellipse cx="1180" cy="76" rx="22" ry="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <rect x="1158" y="76" width="44" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <ellipse cx="1180" cy="106" rx="22" ry="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="1180" y="136" class="actor-title">PostgreSQL</text>
  <text x="1180" y="152" class="actor-sub">(Users &amp; Sessions)</text>

  <!-- Cloudflare R2 -->
  <rect x="1290" y="66" width="90" height="40" class="actor-box" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="1335" y="84" class="actor-title">Cloudflare R2</text>
  <text x="1335" y="100" class="actor-sub">(Private Storage)</text>

  <!-- ================================================================
       Lifelines
       ================================================================ -->
  <line x1="70"   y1="190" x2="70"   y2="1440" class="lifeline"/>
  <line x1="440"  y1="130" x2="440"  y2="1440" class="lifeline"/>
  <line x1="680"  y1="130" x2="680"  y2="1440" class="lifeline"/>
  <line x1="920"  y1="130" x2="920"  y2="1440" class="lifeline"/>
  <line x1="1180" y1="130" x2="1180" y2="1440" class="lifeline"/>
  <line x1="1335" y1="130" x2="1335" y2="1440" class="lifeline"/>

  <!-- ================================================================
       Phase 1 — Authentication & Token Issuance
       ================================================================ -->
  <rect x="20" y="200" width="1360" height="24" class="phase-bg" fill="#dbeafe" stroke="#2563eb"/>
  <text x="700" y="217" class="phase-label">1. Authentication &amp; Token Issuance (Login Flow)</text>

  <!-- Activation bar on middleware (covers Phase 1) -->
  <rect x="434" y="240" width="12" height="310" class="activation"/>

  <!-- Browser → Middleware -->
  <line x1="70" y1="260" x2="434" y2="260" class="msg"/>
  <text x="80" y="254" class="msg-label">POST /web/login (Credentials + CSRF Header/Field)</text>

  <!-- Middleware self-call: validate credentials -->
  <path d="M 446 280 L 486 280 L 486 296 L 446 296" class="self-call"/>
  <text x="496" y="292" class="msg-note">Validate credentials &amp; check active user</text>

  <!-- Middleware → PostgreSQL (SELECT user) -->
  <line x1="446" y1="320" x2="1174" y2="320" class="msg-db"/>
  <text x="456" y="314" class="msg-label">SELECT user WHERE email = $1</text>

  <line x1="1180" y1="345" x2="446" y2="345" class="msg-db-return"/>
  <text x="456" y="339" class="msg-label">User verified</text>

  <!-- Middleware → PostgreSQL (INSERT session) -->
  <line x1="446" y1="378" x2="1174" y2="378" class="msg-db"/>
  <text x="456" y="372" class="msg-label">Insert session row (jti, user_id, user_agent, client_ip)</text>

  <line x1="1180" y1="402" x2="446" y2="402" class="msg-db-return"/>
  <text x="456" y="396" class="msg-label">ok</text>

  <!-- Middleware self-call: mint tokens -->
  <path d="M 446 430 L 486 430 L 486 486 L 446 486" class="self-call"/>
  <text x="496" y="450" class="msg-note">Generate short-lived Access JWT (15m)</text>
  <text x="496" y="466" class="msg-note">&amp; long-lived Refresh JWT with 'jti' (7d)</text>
  <text x="496" y="482" class="msg-note">Rotate CSRF token</text>

  <!-- Middleware → Browser (Set-Cookie response) -->
  <line x1="434" y1="530" x2="70" y2="530" class="msg-return"/>
  <text x="80" y="514" class="msg-label">200/302 OK</text>
  <text x="80" y="530" class="cookie-label">Set-Cookie: auth_token (HttpOnly, Secure)</text>
  <text x="80" y="544" class="cookie-label">Set-Cookie: refresh_token (HttpOnly, Secure)</text>
  <text x="80" y="558" class="cookie-label2">Set-Cookie: csrf_token (Readable)</text>

  <!-- ================================================================
       Phase 2 — Authorization & Silent Refresh
       ================================================================ -->
  <rect x="20" y="590" width="1360" height="24" class="phase-bg" fill="#dcfce7" stroke="#16a34a"/>
  <text x="700" y="607" class="phase-label">2. Authorization &amp; Silent Refresh Flow</text>

  <!-- Activation on middleware -->
  <rect x="434" y="630" width="12" height="300" class="activation"/>

  <!-- Browser → Middleware -->
  <line x1="70" y1="650" x2="434" y2="650" class="msg"/>
  <text x="80" y="644" class="msg-label">GET /web/me (Request protected resource)</text>

  <!-- Alt fragment box -->
  <rect x="30" y="670" width="1300" height="240" class="fragment"/>
  <rect x="30" y="670" width="80" height="22" class="fragment-tab"/>
  <text x="44" y="686" class="fragment-lbl">alt</text>
  <text x="130" y="686" class="fragment-cond">[Valid Access Token Present]</text>

  <!-- Divider line in alt fragment -->
  <line x1="30" y1="780" x2="1330" y2="780" class="fragment-line"/>
  <text x="40" y="800" class="fragment-cond">[Access Token Expired, Valid Refresh Token Present]</text>

  <!-- Middleware self-call: verify access JWT -->
  <path d="M 446 710 L 486 710 L 486 726 L 446 726" class="self-call"/>
  <text x="496" y="722" class="msg-note">Verify Access JWT (stateless)</text>

  <!-- Alt branch 2: check session -->
  <line x1="446" y1="830" x2="1174" y2="830" class="msg-db"/>
  <text x="456" y="824" class="msg-label">Check SessionService.IsActive(jti)</text>

  <line x1="1180" y1="855" x2="446" y2="855" class="msg-db-return"/>
  <text x="456" y="849" class="msg-label">Session active &amp; unrevoked</text>

  <!-- Middleware self-call: mint fresh access JWT -->
  <path d="M 446 878 L 486 878 L 486 894 L 446 894" class="self-call"/>
  <text x="496" y="890" class="msg-note">Mint fresh Access JWT</text>

  <!-- Middleware → Browser (Set-Cookie auth_token) -->
  <line x1="434" y1="920" x2="70" y2="920" class="msg-return"/>
  <text x="80" y="914" class="cookie-label">Set-Cookie: auth_token (New Access Token)</text>

  <!-- Middleware self-call: RequireRole -->
  <path d="M 446 950 L 486 950 L 486 966 L 446 966" class="self-call"/>
  <text x="496" y="962" class="msg-note">Enforce RequireRole() check</text>

  <!-- Middleware → Handlers: pass context -->
  <line x1="446" y1="988" x2="674" y2="988" class="msg"/>
  <text x="456" y="982" class="msg-label">Pass request context (Claims)</text>

  <!-- ================================================================
       Phase 3 — Private Asset Fetching (Presigned URL)
       ================================================================ -->
  <rect x="20" y="1020" width="1360" height="24" class="phase-bg" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="700" y="1037" class="phase-label">3. Private Asset Fetching (Presigned URL)</text>

  <!-- Activation on Handlers -->
  <rect x="674" y="1050" width="12" height="140" class="activation"/>
  <!-- Activation on R2 Client -->
  <rect x="914" y="1050" width="12" height="70" class="activation"/>

  <!-- Handlers → R2 Client (presign) -->
  <line x1="686" y1="1070" x2="914" y2="1070" class="msg-r2"/>
  <text x="696" y="1064" class="msg-label">PresignGetObject(imageKey, 15m)</text>

  <!-- R2 Client self-call -->
  <path d="M 926 1085 L 966 1085 L 966 1101 L 926 1101" class="self-call"/>
  <text x="976" y="1097" class="msg-note">Sign S3 GET Request using R2 Secret</text>

  <!-- R2 Client → Handlers (return URL) -->
  <line x1="914" y1="1120" x2="686" y2="1120" class="msg-r2-return"/>
  <text x="696" y="1114" class="msg-label">Return Presigned R2 URL</text>

  <!-- Handlers → Browser (200 OK, HTML with img tag) -->
  <line x1="680" y1="1165" x2="70" y2="1165" class="msg-return"/>
  <text x="80" y="1159" class="msg-label">200 OK (Render HTML with &lt;img src="presigned-url"&gt;)</text>

  <!-- ================================================================
       Phase 3b — Browser fetches image directly from R2
       ================================================================ -->
  <!-- Browser → Cloudflare R2 (direct, no server hop) -->
  <path d="M 70 1190 C 500 1210, 900 1210, 1330 1190" class="msg-r2"/>
  <text x="630" y="1206" class="msg-label">GET presigned-url (Direct download, no app auth header)</text>

  <path d="M 1335 1230 C 900 1250, 500 1250, 70 1230" class="msg-r2-return"/>
  <text x="630" y="1246" class="msg-label">200 OK (Return Image Bytes)</text>

  <!-- ================================================================
       Phase 4 — Revocation Flow
       ================================================================ -->
  <rect x="20" y="1280" width="1360" height="24" class="phase-bg" fill="#fee2e2" stroke="#dc2626"/>
  <text x="700" y="1297" class="phase-label">4. Revocation Flow (Logout / Role Change)</text>

  <rect x="434" y="1320" width="12" height="120" class="activation"/>

  <!-- Browser → Middleware -->
  <line x1="70" y1="1340" x2="434" y2="1340" class="msg"/>
  <text x="80" y="1334" class="msg-label">POST /web/logout (or Admin updates role)</text>

  <!-- Middleware → PostgreSQL (revoke) -->
  <line x1="446" y1="1365" x2="1174" y2="1365" class="msg-db"/>
  <text x="456" y="1359" class="msg-label">Revoke session(s) in 'sessions' table (set revoked_at)</text>

  <line x1="1180" y1="1390" x2="446" y2="1390" class="msg-db-return"/>
  <text x="456" y="1384" class="msg-label">ok</text>

  <!-- Middleware → Browser (clear cookies) -->
  <line x1="434" y1="1415" x2="70" y2="1415" class="msg-return"/>
  <text x="80" y="1409" class="msg-label">Clear auth_token, refresh_token, &amp; csrf_token cookies</text>

</svg>