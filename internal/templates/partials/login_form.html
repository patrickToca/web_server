<div class="bg-white rounded-lg shadow-lg overflow-hidden fade-in">
    <!-- Header -->
    <div class="px-6 py-8 bg-gradient-to-r from-blue-600 to-blue-700 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/20 mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">Welcome Back</h1>
        <p class="text-blue-100 text-sm mt-1">Sign in to your account</p>
    </div>

    <!-- Body -->
    <div class="px-6 py-6">
        {{if .error}}
        <div class="bg-red-50 border-l-4 border-red-500 p-3 mb-4 rounded" role="alert">
            <div class="flex">
                <svg class="h-5 w-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <p class="ml-3 text-sm text-red-700">{{.error}}</p>
            </div>
        </div>
        {{end}}

        <form hx-post="/web/login"
              hx-target="#login-container"
              hx-swap="innerHTML"
              class="space-y-4">

            <input type="hidden" name="csrf_token" value="{{.csrf_token}}">

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       value="{{.email}}"
                       required
                       autocomplete="email"
                       placeholder="you@example.com"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="relative mt-1">
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           autocomplete="current-password"
                           placeholder="••••••••"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 transition pr-11">

                    <button type="button"
                            id="toggle-password"
                            aria-label="Show password"
                            aria-pressed="false"
                            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-600 focus:outline-none focus:text-blue-600 transition">
                        <svg id="icon-eye" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                        <svg id="icon-eye-off" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2 font-medium">
                <svg class="w-5 h-5 htmx-indicator" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Don't have an account?
                <a href="/web/register" class="text-blue-600 hover:text-blue-800 font-medium">Register</a>
            </p>
        </div>

        <div class="mt-4 p-3 bg-blue-50 rounded-lg border border-blue-200">
            <p class="text-xs text-blue-800 text-center">
                <strong>Demo:</strong> alice@example.com / password123
            </p>
        </div>
    </div>
</div>

<script>
    (function () {
        function initPasswordToggle(root) {
            const input = root.querySelector('#password');
            const btn   = root.querySelector('#toggle-password');
            if (!input || !btn) return;

            const eye    = root.querySelector('#icon-eye');
            const eyeOff = root.querySelector('#icon-eye-off');

            if (btn.dataset.bound === 'true') return;
            btn.dataset.bound = 'true';

            btn.addEventListener('click', () => {
                const showing = input.type === 'text';
                input.type = showing ? 'password' : 'text';
                btn.setAttribute('aria-pressed', String(!showing));
                btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
                if (eye)    eye.classList.toggle('hidden', !showing);
                if (eyeOff) eyeOff.classList.toggle('hidden', showing);
                input.focus();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPasswordToggle(document);
        });

        document.addEventListener('htmx:afterSwap', (evt) => {
            if (evt.detail.target && evt.detail.target.id === 'login-container') {
                initPasswordToggle(evt.detail.target);
            }
        });
    })();
</script>
