<tr id="member-{{.ID}}" class="hover:bg-gray-50 transition duration-150">
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">#{{.ID}}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{.Username}}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{.FullName}}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full {{.StatusBadge}}">
            {{.Status}}
        </span>
    </td>
</tr>
