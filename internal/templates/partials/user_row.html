<tr id="user-{{.ID}}" class="hover:bg-gray-50 transition duration-150">
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">#{{.ID}}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{.Username}}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{.FullName}}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{{.Email}}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full
                     {{if eq .Role "admin"}}bg-purple-100 text-purple-800
                     {{else if eq .Role "moderator"}}bg-yellow-100 text-yellow-800
                     {{else}}bg-gray-100 text-gray-800{{end}}">
            {{.Role}}
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full {{.StatusBadge}}">
            {{.Status}}
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
        <button class="text-blue-600 hover:text-blue-900 transition"
                hx-get="/web/users/{{.ID}}/edit"
                hx-target="#user-form-container"
                hx-swap="innerHTML"
                title="Edit user">
            <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
        </button>
        <button class="text-amber-600 hover:text-amber-900 transition"
                hx-get="/web/users/{{.ID}}/role"
                hx-target="#user-form-container"
                hx-swap="innerHTML"
                title="Change role">
            <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
        </button>
        <button class="text-red-600 hover:text-red-900 transition"
                hx-delete="/web/users/{{.ID}}"
                hx-target="#user-{{.ID}}"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this user?"
                title="Delete user">
            <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </button>
    </td>
</tr>
